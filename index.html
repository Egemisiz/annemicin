<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGE - Arrows Puzzle</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    color: #111;
    font-family: Arial, sans-serif;
}

button {
    font-family: Arial, sans-serif;
}

.screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* =========================
   MENÜ
========================= */

#menu {
    justify-content: center;
    text-align: center;
}

.menu-title {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 8px;
    margin-bottom: 5px;
}

.menu-subtitle {
    font-size: 18px;
    color: #555;
    margin-bottom: 30px;
}

.coins {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 12px;
}

.menu-button {
    width: 230px;
    padding: 17px;
    margin: 8px;
    border: 3px solid #111;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.menu-button:hover {
    transform: scale(1.05);
}

.menu-button.secondary {
    background: white;
    color: #111;
}

/* =========================
   SHOP
========================= */

#shop {
    display: none;
    justify-content: center;
    text-align: center;
}

.shop-title {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 8px;
}

.shop-coins {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 25px;
}

.shop-item {
    width: min(90vw, 360px);
    border: 3px solid #111;
    border-radius: 14px;
    padding: 18px;
    margin: 8px;
    background: white;
}

.shop-item h3 {
    margin: 0 0 7px;
    font-size: 21px;
}

.shop-item p {
    margin: 5px 0 13px;
    color: #555;
}

.shop-item button {
    border: 2px solid #111;
    border-radius: 9px;
    background: #111;
    color: white;
    padding: 10px 18px;
    font-weight: bold;
    cursor: pointer;
}

.shop-item button:disabled {
    background: #ddd;
    color: #777;
    border-color: #aaa;
}

/* =========================
   OYUN
========================= */

#game {
    display: none;
}

#title {
    margin-top: 25px;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 5px;
}

#info {
    width: min(90vw, 520px);
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-size: 19px;
    font-weight: bold;
}

#lives {
    letter-spacing: 2px;
}

#board {
    margin-top: 35px;
    width: min(88vw, 520px);
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 3px;
    padding: 4px;
    background: #111;
    border: 4px solid #111;
}

.cell {
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.arrow {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(30px, 7vw, 55px);
    font-weight: 900;
    cursor: pointer;
    user-select: none;
    transition:
        transform .35s ease,
        opacity .35s ease;
}

.arrow:hover {
    transform: scale(1.08);
}

#message {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}

.game-button {
    display: none;
    margin-top: 15px;
    padding: 12px 25px;
    border: 2px solid #111;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#menuButton {
    display: block;
    background: white;
    color: #111;
}

/* =========================
   TEMALAR
========================= */

.dark-theme {
    background: #111;
    color: white;
}

.dark-theme .cell {
    background: #222;
}

.dark-theme #board {
    background: white;
    border-color: white;
}

.dark-theme .menu-subtitle,
.dark-theme .shop-item p {
    color: #bbb;
}

.dark-theme .menu-button.secondary,
.dark-theme .back-button,
.dark-theme .shop-item {
    background: #111;
    color: white;
    border-color: white;
}

.gold-arrows .arrow {
    text-shadow: 0 0 8px #d4af37;
}

/* =========================
   MOBİL
========================= */

@media (max-width: 500px) {

    .menu-title {
        font-size: 50px;
    }

    #board {
        margin-top: 25px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENÜ
========================= -->

<div id="menu" class="screen">

    <div class="menu-title">
        EGE
    </div>

    <div class="menu-subtitle">
        ARROWS PUZZLE ESCAPE
    </div>

    <div class="coins">
        🪙 <span id="menuCoins">0</span>
    </div>

    <button class="menu-button" id="startButton">
        ▶ BAŞLA
    </button>

    <button class="menu-button secondary" id="shopButton">
        🛒 SHOP
    </button>

    <button class="menu-button secondary" id="howButton">
        ? NASIL OYNANIR
    </button>

</div>


<!-- =========================
     SHOP
========================= -->

<div id="shop" class="screen">

    <div class="shop-title">
        SHOP
    </div>

    <div class="shop-coins">
        🪙 <span id="shopCoins">0</span>
    </div>

    <div class="shop-item">

        <h3>❤️ EKSTRA CAN</h3>

        <p>
            Her level başında 4 can.
        </p>

        <button id="buyHeart">
            🪙 100
        </button>

    </div>

    <div class="shop-item">

        <h3>🌑 KOYU TEMA</h3>

        <p>
            Oyunun görünümünü değiştir.
        </p>

        <button id="buyDark">
            🪙 150
        </button>

    </div>

    <div class="shop-item">

        <h3>✨ ALTIN OKLAR</h3>

        <p>
            Oklarına özel görünüm.
        </p>

        <button id="buyGold">
            🪙 200
        </button>

    </div>

    <button class="back-button" id="shopBack">
        ← MENÜ
    </button>

</div>


<!-- =========================
     OYUN
========================= -->

<div id="game" class="screen">

    <div id="title">
        EGE
    </div>

    <div id="info">

        <span>
            LEVEL <span id="level">1</span>
        </span>

        <span id="lives">
            ❤️ ❤️ ❤️
        </span>

    </div>

    <div id="board"></div>

    <div id="message">
        Okları dışarı çıkar!
    </div>

    <button id="next" class="game-button">
        SONRAKİ LEVEL ➜
    </button>

    <button id="menuButton" class="game-button">
        MENÜYE DÖN
    </button>

</div>


<script>

/* ==================================================
   TEMEL AYARLAR
================================================== */

const SIZE = 6;

let level = 1;
let lives = 3;
let arrows = [];
let levelWon = false;


/* ==================================================
   COIN SİSTEMİ
================================================== */

let coins =
    Number(localStorage.getItem("egeCoins")) || 0;


let owned = {

    heart:
        localStorage.getItem("egeHeart") === "true",

    dark:
        localStorage.getItem("egeDark") === "true",

    gold:
        localStorage.getItem("egeGold") === "true"

};


function saveData() {

    localStorage.setItem(
        "egeCoins",
        coins
    );

    localStorage.setItem(
        "egeHeart",
        owned.heart
    );

    localStorage.setItem(
        "egeDark",
        owned.dark
    );

    localStorage.setItem(
        "egeGold",
        owned.gold
    );

}


function updateCoins() {

    document.getElementById("menuCoins")
        .textContent = coins;

    document.getElementById("shopCoins")
        .textContent = coins;

}


/* ==================================================
   YÖNLER
================================================== */

const directions = {

    up: {
        symbol: "↑",
        dr: -1,
        dc: 0
    },

    down: {
        symbol: "↓",
        dr: 1,
        dc: 0
    },

    left: {
        symbol: "←",
        dr: 0,
        dc: -1
    },

    right: {
        symbol: "→",
        dr: 0,
        dc: 1
    }

};


/* ==================================================
   SABİT LEVEL TASARIMLARI
================================================== */

const levels = [

    [
        {r:2,c:2,d:"right"},
        {r:2,c:3,d:"right"},
        {r:3,c:1,d:"up"},
        {r:3,c:3,d:"down"},
        {r:4,c:3,d:"left"},
        {r:4,c:4,d:"up"}
    ],

    [
        {r:1,c:1,d:"right"},
        {r:1,c:2,d:"right"},
        {r:1,c:4,d:"down"},
        {r:2,c:4,d:"down"},
        {r:3,c:2,d:"left"},
        {r:3,c:3,d:"left"},
        {r:4,c:2,d:"up"},
        {r:4,c:4,d:"up"}
    ],

    [
        {r:1,c:1,d:"down"},
        {r:2,c:1,d:"right"},
        {r:2,c:2,d:"right"},
        {r:2,c:4,d:"down"},
        {r:3,c:4,d:"left"},
        {r:3,c:3,d:"left"},
        {r:4,c:2,d:"up"},
        {r:5,c:2,d:"up"},
        {r:4,c:5,d:"left"}
    ],

    [
        {r:1,c:1,d:"right"},
        {r:1,c:2,d:"down"},
        {r:2,c:2,d:"right"},
        {r:2,c:3,d:"down"},
        {r:3,c:3,d:"left"},
        {r:3,c:2,d:"down"},
        {r:4,c:2,d:"right"},
        {r:4,c:3,d:"right"},
        {r:4,c:4,d:"up"},
        {r:5,c:4,d:"up"}
    ],

    [
        {r:0,c:1,d:"down"},
        {r:1,c:1,d:"right"},
        {r:1,c:2,d:"down"},
        {r:2,c:2,d:"right"},
        {r:2,c:3,d:"down"},
        {r:3,c:3,d:"left"},
        {r:3,c:2,d:"down"},
        {r:4,c:2,d:"right"},
        {r:4,c:3,d:"right"},
        {r:4,c:4,d:"up"},
        {r:5,c:4,d:"left"},
        {r:5,c:3,d:"up"}
    ]

];


/* ==================================================
   GERÇEK ÇÖZÜLEBİLİRLİK KONTROLÜ
================================================== */

/*
   Bir level'ın çözülebilir olması için:

   Herhangi bir anda dışarı çıkabilen en az
   bir ok bulunmalı.

   O ok kaldırılır.

   Sonra tekrar kontrol edilir.

   Bütün oklar sırayla kaldırılabiliyorsa
   level çözülebilirdir.
*/

function canArrowLeave(state, arrowIndex) {

    const arrow = state[arrowIndex];

    const dir =
        directions[arrow.d];

    let row = arrow.r + dir.dr;
    let col = arrow.c + dir.dc;


    while(
        row >= 0 &&
        row < SIZE &&
        col >= 0 &&
        col < SIZE
    ) {

        const blocked =
            state.some(function(other, index) {

                return (
                    index !== arrowIndex &&
                    other.r === row &&
                    other.c === col
                );

            });


        if(blocked) {
            return false;
        }


        row += dir.dr;
        col += dir.dc;

    }


    return true;

}


function solveLevel(state) {

    if(state.length === 0) {
        return true;
    }


    for(let i = 0; i < state.length; i++) {

        if(canArrowLeave(state, i)) {

            const nextState =
                state.filter(function(_, index) {

                    return index !== i;

                });


            if(solveLevel(nextState)) {
                return true;
            }

        }

    }


    return false;

}


function isLevelSolvable(data) {

    return solveLevel(
        data.map(function(item) {

            return {
                r: item.r,
                c: item.c,
                d: item.d
            };

        })
    );

}


/* ==================================================
   SEVİYE GÜVENLİĞİ
================================================== */

function getSafeLevel() {

    const original =
        levels[(level - 1) % levels.length];


    /*
       Level gerçekten çözülebiliyorsa kullan.
    */

    if(isLevelSolvable(original)) {
        return original;
    }


    /*
       Eski level sorunluysa otomatik olarak
       basit ve kesin çözülebilir bir level üret.
    */

    return generateSafeLevel();

}


/* ==================================================
   GARANTİLİ LEVEL ÜRETİCİ
================================================== */

function generateSafeLevel() {

    const result = [];

    const used = new Set();

    const count =
        Math.min(
            5 + Math.floor(level / 2),
            18
        );


    /*
       Rastgele oklar oluşturuyoruz.
       Üretimden sonra çözüm kontrolü yapılıyor.
    */

    let attempts = 0;


    while(
        result.length < count &&
        attempts < 500
    ) {

        attempts++;


        const r =
            Math.floor(Math.random() * SIZE);

        const c =
            Math.floor(Math.random() * SIZE);


        const key =
            r + "," + c;


        if(used.has(key)) {
            continue;
        }


        const dirs =
            ["up","down","left","right"];


        const d =
            dirs[
                Math.floor(
                    Math.random() * dirs.length
                )
            ];


        used.add(key);


        result.push({
            r: r,
            c: c,
            d: d
        });

    }


    /*
       Eğer rastgele üretilen level çözülemiyorsa
       kesin çözülebilir bir şekil oluştur.
    */

    if(isLevelSolvable(result)) {
        return result;
    }


    return generateGuaranteedLevel();

}


/* ==================================================
   KESİN GARANTİLİ LEVEL
================================================== */

function generateGuaranteedLevel() {

    const result = [];

    /*
       Okları dışarıya doğru yönlendiriyoruz.
       Böylece her zaman en az birkaç çıkış var.
    */

    const patterns = [

        {r:1,c:1,d:"up"},
        {r:1,c:2,d:"up"},
        {r:1,c:3,d:"up"},
        {r:2,c:1,d:"left"},
        {r:2,c:2,d:"up"},
        {r:2,c:3,d:"right"},
        {r:3,c:1,d:"left"},
        {r:3,c:2,d:"down"},
        {r:3,c:3,d:"right"},
        {r:4,c:1,d:"down"},
        {r:4,c:2,d:"down"},
        {r:4,c:3,d:"right"}
    ];


    const amount =
        Math.min(
            patterns.length,
            5 + Math.floor(level / 2)
        );


    for(let i = 0; i < amount; i++) {

        result.push(patterns[i]);

    }


    return result;

}


/* ==================================================
   EKRANLAR
================================================== */

const menu =
    document.getElementById("menu");

const game =
    document.getElementById("game");

const shop =
    document.getElementById("shop");


/* ==================================================
   BAŞLA
================================================== */

document.getElementById("startButton")
.addEventListener("click", function() {

    menu.style.display = "none";
    shop.style.display = "none";
    game.style.display = "flex";

    level = 1;

    lives =
        owned.heart ? 4 : 3;

    updateLives();

    createLevel();

});


/* ==================================================
   NASIL OYNANIR
================================================== */

document.getElementById("howButton")
.addEventListener("click", function() {

    alert(
        "🎮 NASIL OYNANIR?\n\n" +
        "Okların üzerine bas.\n" +
        "Önü açıksa ok dışarı çıkar.\n" +
        "Önünde başka ok varsa çıkamaz.\n" +
        "Yanlış hamle yaparsan can kaybedersin.\n" +
        "Bütün okları çıkar ve leveli tamamla!\n\n" +
        "🪙 Her level +25 coin."
    );

});


/* ==================================================
   SHOP
================================================== */

document.getElementById("shopButton")
.addEventListener("click", function() {

    menu.style.display = "none";
    shop.style.display = "flex";

    updateCoins();
    updateShopButtons();

});


document.getElementById("shopBack")
.addEventListener("click", function() {

    shop.style.display = "none";
    menu.style.display = "flex";

});


/* ==================================================
   SHOP BUTONLARI
================================================== */

function updateShopButtons() {

    const heart =
        document.getElementById("buyHeart");

    const dark =
        document.getElementById("buyDark");

    const gold =
        document.getElementById("buyGold");


    heart.disabled = owned.heart;
    dark.disabled = owned.dark;
    gold.disabled = owned.gold;


    if(owned.heart)
        heart.textContent = "✓ ALINDI";

    if(owned.dark)
        dark.textContent = "✓ ALINDI";

    if(owned.gold)
        gold.textContent = "✓ ALINDI";

}


/* ==================================================
   EKSTRA CAN
================================================== */

document.getElementById("buyHeart")
.addEventListener("click", function() {

    if(owned.heart) return;


    if(coins < 100) {

        alert("Yeterli coinin yok kk! 🪙");

        return;

    }


    coins -= 100;

    owned.heart = true;

    saveData();

    updateCoins();

    updateShopButtons();

});


/* ==================================================
   KOYU TEMA
================================================== */

document.getElementById("buyDark")
.addEventListener("click", function() {

    if(owned.dark) return;


    if(coins < 150) {

        alert("Yeterli coinin yok kk! 🪙");

        return;

    }


    coins -= 150;

    owned.dark = true;

    saveData();

    updateCoins();

    updateShopButtons();

    applyThemes();

});


/* ==================================================
   ALTIN OKLAR
================================================== */

document.getElementById("buyGold")
.addEventListener("click", function() {

    if(owned.gold) return;


    if(coins < 200) {

        alert("Yeterli coinin yok kk! 🪙");

        return;

    }


    coins -= 200;

    owned.gold = true;

    saveData();

    updateCoins();

    updateShopButtons();

    applyThemes();

});


/* ==================================================
   TEMA
================================================== */

function applyThemes() {

    document.body.classList.toggle(
        "dark-theme",
        owned.dark
    );

    document.body.classList.toggle(
        "gold-arrows",
        owned.gold
    );

}


/* ==================================================
   CAN
================================================== */

function updateLives() {

    document.getElementById("lives")
        .textContent =
        "❤️ ".repeat(lives).trim();

}


/* ==================================================
   LEVEL OLUŞTUR
================================================== */

function createLevel() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    arrows = [];

    levelWon = false;


    /*
       Boş hücreleri oluştur.
    */

    for(let i = 0; i < SIZE * SIZE; i++) {

        const cell =
            document.createElement("div");

        cell.className = "cell";

        cell.dataset.index = i;

        board.appendChild(cell);

    }


    /*
       Önce level'ın çözülüp çözülmediğini kontrol ediyoruz.
    */

    const data =
        getSafeLevel();


    /*
       Aynı hücreye iki ok gelmesini engelle.
    */

    const usedCells = new Set();


    data.forEach(function(item, index) {

        const cellIndex =
            item.r * SIZE + item.c;


        if(usedCells.has(cellIndex)) {
            return;
        }


        usedCells.add(cellIndex);


        const cell =
            board.children[cellIndex];


        const arrow =
            document.createElement("div");


        arrow.className = "arrow";


        arrow.textContent =
            directions[item.d].symbol;


        const object = {

            id: index,

            index: cellIndex,

            direction: item.d,

            element: arrow,

            removed: false

        };


        arrows.push(object);


        cell.appendChild(arrow);


        arrow.addEventListener(
            "click",
            function() {

                moveArrow(object);

            }
        );

    });


    document.getElementById("level")
        .textContent = level;


    document.getElementById("message")
        .textContent =
        "Okları dışarı çıkar!";


    document.getElementById("next")
        .style.display = "none";


    document.getElementById("menuButton")
        .style.display = "block";


    applyThemes();

}


/* ==================================================
   KONUM
================================================== */

function getRow(index) {

    return Math.floor(index / SIZE);

}


function getCol(index) {

    return index % SIZE;

}


/* ==================================================
   YOL KONTROLÜ
================================================== */

function isPathClear(arrow) {

    const direction =
        directions[arrow.direction];


    let row =
        getRow(arrow.index);

    let col =
        getCol(arrow.index);


    row += direction.dr;
    col += direction.dc;


    while(
        row >= 0 &&
        row < SIZE &&
        col >= 0 &&
        col < SIZE
    ) {

        const index =
            row * SIZE + col;


        const blocking =
            arrows.find(function(a) {

                return (
                    !a.removed &&
                    a.index === index
                );

            });


        if(blocking) {

            return false;

        }


        row += direction.dr;
        col += direction.dc;

    }


    return true;

}


/* ==================================================
   OKU ÇIKAR
================================================== */

function moveArrow(arrow) {

    if(arrow.removed) return;

    if(levelWon) return;


    if(!isPathClear(arrow)) {

        lives--;

        updateLives();


        document.getElementById("message")
            .textContent =
            "Önü kapalı! ❤️ -1";


        arrow.element.style.transform =
            "translateX(-8px)";


        setTimeout(function() {

            arrow.element.style.transform =
                "translateX(8px)";

        }, 70);


        setTimeout(function() {

            arrow.element.style.transform =
                "translateX(0)";

        }, 140);


        if(lives <= 0) {

            document.getElementById("message")
                .textContent =
                "OYUN BİTTİ!";


            setTimeout(function() {

                lives =
                    owned.heart ? 4 : 3;

                createLevel();

            }, 1200);

        }


        return;

    }


    arrow.removed = true;


    const direction =
        directions[arrow.direction];


    let x = 0;
    let y = 0;


    if(direction.dc > 0)
        x = 600;

    if(direction.dc < 0)
        x = -600;

    if(direction.dr > 0)
        y = 600;

    if(direction.dr < 0)
        y = -600;


    arrow.element.style.transform =
        `translate(${x}px, ${y}px) scale(1.4)`;


    arrow.element.style.opacity = "0";


    setTimeout(function() {

        arrow.element.remove();

        checkWin();

    }, 350);

}


/* ==================================================
   KAZANMA
================================================== */

function checkWin() {

    const remaining =
        arrows.filter(function(a) {

            return !a.removed;

        });


    if(
        remaining.length === 0 &&
        !levelWon
    ) {

        levelWon = true;


        coins += 25;


        saveData();

        updateCoins();


        document.getElementById("message")
            .textContent =
            "🎉 LEVEL TAMAMLANDI! +25 🪙";


        document.getElementById("next")
            .style.display = "block";

    }

}


/* ==================================================
   SONRAKİ LEVEL
================================================== */

document.getElementById("next")
.addEventListener("click", function() {

    if(!levelWon) return;


    level++;


    lives =
        owned.heart ? 4 : 3;


    updateLives();

    createLevel();

});


/* ==================================================
   MENÜ
================================================== */

document.getElementById("menuButton")
.addEventListener("click", function() {

    game.style.display = "none";

    menu.style.display = "flex";

    updateCoins();

});


/* ==================================================
   BAŞLANGIÇ
================================================== */

updateCoins();

applyThemes();

</script>

</body>
</html>
